server:
  port: 8888

spring:
  application:
    name: StockAI
  ai:
    # MCP Server：外部 AI 客户端通过 SSE 端点 /sse 调用交易与持仓工具
    mcp:
      server:
        name: stockai-mcp
        version: 1.0.0
        instructions: "StockAI 交易与持仓服务。可买入/卖出持仓，并查询持仓及预设的止盈止损价格。"
        capabilities:
          tool: true
    openai:
     api-key: sk-fbad694281a4480488760a1cd09b83d7
     base-url: https://api.deepseek.com
     chat:
       options:
        #  model: deepseek-v4-pro
         model: deepseek-flash
      # api-key: sk-80afdd9c8d07429f98af10e778604da8
      # base-url: https://dashscope.aliyuncs.com/compatible-mode
      # chat:
      #   options:
      #     model: qwen-max
  # MongoDB
  data:
    mongodb:
      # MongoDB_ubuntu
      # uri: mongodb://admin:tradingagents123@192.168.31.88:27017/tradingagents?authSource=admin
      # MongoDD_local
      uri: mongodb://localhost:27017/tradingagents

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.xian.stockai: DEBUG

# 止盈止损监控定时任务 cron（工作日收盘后 15:30）
monitor:
  cron: "0 30 15 * * ?"

# 飞书自定义机器人推送（默认关闭）
feishu:
  enabled: false
  webhook-url: ""
  secret: ""

# 市场温度计：收盘后判定定时任务与量化阈值
market-regime:
  cron: "0 30 15 * * ?"
  benchmark-index: "sh000300"
  thresholds:
    volatility-high: 0.30
    valuation-high: 0.80

# 选股引擎：三风格四因子权重（估值/成长/质量/动量）
screening:
  cron: "0 0 18 * * MON-FRI"
  weights:
    value:
      valuation: 0.40
      growth: 0.20
      quality: 0.30
      momentum: 0.10
    growth:
      valuation: 0.10
      growth: 0.40
      quality: 0.20
      momentum: 0.30
    balanced:
      valuation: 0.25
      growth: 0.25
      quality: 0.30
      momentum: 0.20

stockai:
  mcp:
    # MCP 工具未传 userId 时使用的默认用户（与 StockAI-Console 当前用户一致）
    default-user-id: "6928fca14f206ada1b7a9269"

# 交易计划：ATR 参数、批次档位与周报配置
trade-plan:
  atr-period: 14
  stop-atr-multiplier: 2.0
  risk-reward: 2.0
  support-resistance-window: 20
  high-volatility-threshold: 0.03
  mid-volatility-threshold: 0.02
  min-kline-count: 15
  degraded-stop-loss-rate: 0.05
  degraded-take-profit-rate: 0.10
  summary-retention-weeks: 12
  summary-cron: "0 0 8 ? * SAT"
# 卖出纪律：L1 硬止损 / L2 移动止盈 / L4 分批止盈
# 判定时点放在 17:30，等 etf-service 16:00~16:20 的日线任务先落库
exit:
  hard-stop-rate: 0.25
  hard-stop-relax-atr-ratio: 0.04
  hard-stop-relaxed-rate: 0.30
  # ETF 按 60 日年化波动率分档：低波动收紧、高波动放宽
  etf-hard-stop-tiers:
    - max-volatility: 0.15
      hard-stop-rate: 0.15
    - max-volatility: 0.25
      hard-stop-rate: 0.20
    - max-volatility: null
      hard-stop-rate: 0.25
  # 换档滞回带宽：σ 要越过档位边界 2 个点才换档，否则在 15% 附近来回抖就会让止损线跳 5 个点
  etf-hard-stop-hysteresis: 0.02
  trailing-arm-return: 0.30
  trailing-rate: 0.15
  breakeven-return: 0.10
  take-profit-1-return: 0.30
  take-profit-1-fraction: 0.3333
  take-profit-2-return: 0.60
  take-profit-2-fraction: 0.3333
  add-buffer-trade-days: 10
  signal-cooldown-trade-days: 5
  # 只落库不推送；需要飞书提醒时改成 true
  notify-enabled: false
  cron: "0 30 17 ? * MON-FRI"
  default-user-id: "6928fca14f206ada1b7a9269"
