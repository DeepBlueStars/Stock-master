server:
  port: 8888

spring:
  application:
    name: StockAI
  ai:
    openai:
     api-key: sk-fbad694281a4480488760a1cd09b83d7
     base-url: https://api.deepseek.com
     chat:
       options:
        #  model: deepseek-v4-pro
         model: deepseek-v4-flash
      # api-key: sk-80afdd9c8d07429f98af10e778604da8
      # base-url: https://dashscope.aliyuncs.com/compatible-mode
      # chat:
      #   options:
      #     model: qwen-max
  # MongoDB
  data:
    mongodb:
      # MongoDB_ubuntu
      # uri: mongodb://admin:tradingagents123@192.168.31.88:27017/tradingagents?authSource=admin
      # MongoDD_local
      uri: mongodb://localhost:27017/tradingagents

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.xian.stockai: DEBUG

# 止盈止损监控定时任务 cron（工作日收盘后 15:30）
monitor:
  cron: "0 30 15 * * ?"

# 飞书自定义机器人推送（默认关闭）
feishu:
  enabled: false
  webhook-url: ""
  secret: ""

# 市场温度计：收盘后判定定时任务与量化阈值
market-regime:
  cron: "0 30 15 * * ?"
  benchmark-index: "sh000300"
  thresholds:
    volatility-high: 0.30
    valuation-high: 0.80

# 选股引擎：三风格四因子权重（估值/成长/质量/动量）
screening:
  weights:
    value:
      valuation: 0.40
      growth: 0.20
      quality: 0.30
      momentum: 0.10
    growth:
      valuation: 0.10
      growth: 0.40
      quality: 0.20
      momentum: 0.30
    balanced:
      valuation: 0.25
      growth: 0.25
      quality: 0.30
      momentum: 0.20